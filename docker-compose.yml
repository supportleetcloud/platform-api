services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: practice_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    environment:
      # Overrides env_file: containers reach Postgres and each other by
      # service name, not localhost, and the browser needs the frontend
      # on its published host port.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/practice_platform
      PORT: 4000
      FRONTEND_URL: http://localhost:3000
      # The image sets NODE_ENV=production, which makes the session cookie
      # `secure: true` (backend/src/app.ts) — correct behind a real TLS
      # terminator, but this compose setup serves plain HTTP on localhost,
      # so the browser silently drops the cookie and every request looks
      # unauthenticated. Override for this local/plain-HTTP context.
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Baked into the client bundle at build time — must be reachable
        # from the browser (host-published port), not the container network.
        NEXT_PUBLIC_BACKEND_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
